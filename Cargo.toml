[workspace]
members = [
    ".",                     # surreal-memory-server binary (root)
    "crates/surreal-memory", # embeddable library crate
]
resolver = "2"

[patch.crates-io]
# Reuse the UAR numerical and tokenizer fixes without changing feature selection.
gemm = { path = "vendor/patches/gemm-0.19.0" }
gemm-common = { path = "vendor/patches/gemm-common-0.19.0" }
gemm-c32 = { path = "vendor/patches/gemm-c32-0.19.0" }
gemm-c64 = { path = "vendor/patches/gemm-c64-0.19.0" }
gemm-f16 = { path = "vendor/patches/gemm-f16-0.19.0" }
gemm-f32 = { path = "vendor/patches/gemm-f32-0.19.0" }
gemm-f64 = { path = "vendor/patches/gemm-f64-0.19.0" }
pulp = { path = "vendor/patches/pulp-0.22.3" }
rav1e = { path = "vendor/patches/rav1e-0.8.1" }
tokenizers-v021 = { package = "tokenizers", path = "vendor/patches/tokenizers-0.21.4" }
tokenizers-v022 = { package = "tokenizers", path = "vendor/patches/tokenizers-0.22.2" }
tokenizers-v023 = { package = "tokenizers", path = "vendor/patches/tokenizers-0.23.2" }
heapless = { path = "vendor/patches/heapless-0.7.17" }
indicatif = { path = "vendor/patches/indicatif-0.17.11" }
surrealmx = { path = "vendor/patches/surrealmx-1.1.0" }
# Reuse UAR's RustCrypto dependency repair on the SurrealDB 4.0 JWT API line.
jsonwebtoken = { path = "vendor/patches/jwt-rustcrypto/jsonwebtoken-10.4.0" }
# Reuse UAR's core pin! migration from the unmaintained pin-utils crate.
wasmtimer = { path = "vendor/patches/wasmtimer-0.4.3" }

[workspace.dependencies]
mempalace-core = { git = "https://github.com/GQAdonis/mempalace-rs.git", rev = "f8a1b4c86ef28f8f8070142d600e650f187c538d" }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep the SDK and schema types aligned with the deployed SurrealDB server.
surrealdb = { version = "=4.0.0" }
surrealdb_types = { package = "surrealdb-types", version = "=4.0.0" }
anyhow = "1.0.102"
thiserror = "2.0.18"
sha2 = "0.11.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
async-trait = "0.1.89"
chrono = "0.4.44"
reqwest = { version = "0.13.2", features = ["json"] }
async-openai = "0.34.0"
tiktoken-rs = "0.9.1"
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rand = "0.10.0"
arc-swap = "1.7"

[package]
name = "surreal-memory-server"
version = "1.11.0"
edition = "2024"

[dependencies]
# Library crate
surreal-memory = { path = "crates/surreal-memory", default-features = false }

# MCP SDK
rmcp = { version = "=3.9.0", features = [
    "server",
    "transport-io",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }

# Shared (workspace)
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
surrealdb_types = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# HTTP SSE Transport
dashmap = "6.1.0"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
uuid = { workspace = true }

# Binary-only
dotenvy = "0.15"
dirs = "6"

mempalace-core = { workspace = true, optional = true }

# Candle for local embeddings (optional)
candle-core = { version = "=0.11.1", optional = true }
candle-nn = { version = "=0.11.1", optional = true }
candle-transformers = { version = "=0.11.1", optional = true }
tokenizers = { version = "0.22.2", optional = true }
hf-hub = { version = "=0.5.0", features = ["tokio"], optional = true }

[features]
default = ["embedded"]
embedded = ["surreal-memory/embedded"]
server-only = []
palace = ["surreal-memory/palace"]
local-embeddings = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "tokenizers",
    "hf-hub",
    "surreal-memory/local-embeddings",
]
cuda = [
    "local-embeddings",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "surreal-memory/cuda",
]
metal = [
    "local-embeddings",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "surreal-memory/metal",
]

[profile.dev]
# Speed up local iterations. Keep release behavior unchanged.
debug = 0
incremental = true
codegen-units = 256

[profile.dev.build-override]
debug = 0
codegen-units = 256

# SurrealDB 4.0's query executor walks its operator tree with large frames; at
# opt-level 0 that overflows the 2 MiB test-thread stack and runs ~25x slower.
[profile.dev.package.surrealdb-core]
opt-level = 1

[profile.dev.package.surrealdb-expr]
opt-level = 1

[profile.test]
# Tests currently spend most of their time compiling, not executing.
debug = 0
incremental = true
codegen-units = 256

[profile.test.build-override]
debug = 0
codegen-units = 256
