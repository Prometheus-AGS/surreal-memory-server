[workspace]
members = [
    ".",                     # surreal-memory-server binary (root)
    "crates/surreal-memory", # embeddable library crate
]
resolver = "2"

[workspace.dependencies]
mempalace-core = { git = "https://github.com/GQAdonis/mempalace-rs.git", branch = "main" }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "3.2.1" }
surrealdb_types = { package = "surrealdb-types", version = "3.2.1" }
anyhow = "1.0.102"
thiserror = "2.0.18"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
async-trait = "0.1.89"
chrono = "0.4.44"
reqwest = { version = "0.13.2", features = ["json"] }
async-openai = "0.34.0"
tiktoken-rs = "0.9.1"
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rand = "0.10.0"
arc-swap = "1.7"

[package]
name = "surreal-memory-server"
version = "1.7.0"
edition = "2024"

[dependencies]
# Library crate
surreal-memory = { path = "crates/surreal-memory", default-features = false }

# MCP SDK
# `rev` is REQUIRED, not decorative. Without it this dependency floats to the
# default branch HEAD, and `cargo update` re-resolves straight past the
# committed Cargo.lock — picking an rmcp whose `model::Content` no longer
# exists (it is `ContentBlock` in 2.x). Reproduced 2026-07-31:
# `rm Cargo.lock && cargo check` fails with E0432 + E0639, while a plain
# `cargo check` succeeds on the stale lock. A lockfile records a resolution; it
# does not constrain the next one.
#
# a64be231 is what the committed lockfile already resolves to, so pinning it
# changes nothing today — it only stops the drift.
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "a64be231527f923e9f84d4dd7bf3c3bd695ee53e", features = [
    "server",
    "transport-io",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }

# Shared (workspace)
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
surrealdb_types = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# HTTP SSE Transport
dashmap = "6.1.0"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
uuid = { workspace = true }

# Binary-only
dotenvy = "0.15"
dirs = "6"

mempalace-core = { workspace = true, optional = true }

# Candle for local embeddings (optional)
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
tokenizers = { version = "0.22.2", optional = true }
hf-hub = { version = "0.5.0", features = ["tokio"], optional = true }

[features]
default = ["embedded"]
embedded = ["surreal-memory/embedded"]
server-only = []
palace = ["surreal-memory/palace"]
local-embeddings = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "tokenizers",
    "hf-hub",
    "surreal-memory/local-embeddings",
]
cuda = [
    "local-embeddings",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
metal = [
    "local-embeddings",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

[profile.dev]
# Speed up local iterations. Keep release behavior unchanged.
debug = 0
incremental = true
codegen-units = 256

[profile.dev.build-override]
debug = 0
codegen-units = 256

[profile.test]
# Tests currently spend most of their time compiling, not executing.
debug = 0
incremental = true
codegen-units = 256

[profile.test.build-override]
debug = 0
codegen-units = 256
