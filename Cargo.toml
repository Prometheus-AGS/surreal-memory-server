[package]
name = "surreal-memory-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# MCP SDK
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = ["server", "transport-io", "macros"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SurrealDB
surrealdb = { version = "2.0", features = ["kv-rocksdb"] }  # Embedded
# surrealdb = { version = "2.0" }  # For server-only mode

# HTTP client for embedding APIs
reqwest = { version = "0.12.24", features = ["json"] }

# Candle for local embeddings
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
tokenizers = "0.22.1"

# Hugging Face hub for model downloads
hf-hub = { version = "0.4.3", features = ["tokio"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Config
dotenvy = "0.15"
chrono = "0.4.42"
async-trait = "0.1.89"
dirs = "6"

[features]
default = ["embedded"]
embedded = ["surrealdb/kv-rocksdb"]
server-only = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
