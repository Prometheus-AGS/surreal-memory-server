name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  build-and-test:
    name: Build, Clippy & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Start SurrealDB test dependency
        run: |
          docker run --detach --rm \
            --name surrealdb-ci \
            --publish 28000:8000 \
            surrealdb/surrealdb:v3.0.5@sha256:f703abfda71faa20572c9b0e99a1e2cb89494525ecc7a88345306c0fd3333845 \
            start \
            --log=warn \
            --user=root \
            --pass=root \
            --bind=0.0.0.0:8000 \
            memory

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:28000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs surrealdb-ci
          exit 1

      - name: cargo test
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: 1
          TEST_SURREAL_ENDPOINT: ws://127.0.0.1:28000
          TEST_SURREAL_USERNAME: root
          TEST_SURREAL_PASSWORD: root
