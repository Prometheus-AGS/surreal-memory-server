server {
    # Listen on port 80 (standard HTTP). 
    # For home network access, configure your router/DNS to resolve 'surreal-memory.local' to this machine's IP,
    # or change this to the IP address of the machine on the network.
    listen 80;
    listen [::]:80;
    server_name surreal-memory.local localhost;

    # Reverse proxy for all surreal-memory-server requests
    location / {
        # Proxy to the Docker compose exposed port
        proxy_pass http://localhost:23001;
        proxy_http_version 1.1;
        
        # Critical headers for Server-Sent Events (SSE) and WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # Forward original client IPs
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering to ensure SSE events stream immediately without lag
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        # Disable read/send timeouts for long-running MCP streams
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
