[package]
name = "surreal-memory"
version = "0.1.0"
edition = "2024"
description = "Embeddable SurrealDB-backed agent memory library with knowledge graph, scoped memory, TaskStreams, mindmaps, and Graph-RAG"
license = "MIT"
repository = "https://github.com/gqadonis/surreal-memory-server"
documentation = "https://docs.rs/surreal-memory"
readme = "README.md"
keywords = ["memory", "surrealdb", "agent", "knowledge-graph", "mcp"]
categories = ["database", "data-structures"]


[lib]
name = "surreal_memory"
path = "src/lib.rs"

[features]
default = ["embedded"]
embedded = ["surrealdb/kv-rocksdb"]
local-embeddings = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "tokenizers",
    "hf-hub",
]
cuda = [
    "local-embeddings",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
metal = [
    "local-embeddings",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

[dependencies]
# Workspace
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
surrealdb_types = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tiktoken-rs = { workspace = true }
uuid = { workspace = true }

# Candle local embeddings (optional)
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
tokenizers = { version = "0.22.2", optional = true }
hf-hub = { version = "0.5.0", features = ["tokio"], optional = true }

# Utilities
dirs = "6"
rand = { workspace = true }
