# Docker Compose configuration for SurrealDB
# Use with surreal-memory-server in server mode:
#   SURREAL_MODE=server SURREAL_ENDPOINT=ws://localhost:8000 ./target/release/surreal-memory-server

services:
  surrealdb:
    # Kept in lockstep with the `surrealdb = "=4.0.0"` crate this server links (Cargo.toml).
    # Pinned by digest because a tag is mutable; the same pin as prometheus-skills-mini and
    # universal-agent-runtime, which share this SurrealDB.
    image: surrealdb/surrealdb:v4.0.0@sha256:c35893410644e65fa90aa1bef446ac9cb0a0c2733b9d405ce3eb56754b85c330
    container_name: surrealdb
    restart: unless-stopped
    user: root
    command:
      - start
      - --log=info
      - --user=root
      - --pass=root
      - --bind=0.0.0.0:8000
      - surrealkv:/data/database.db
    ports:
      - "28000:8000"
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  surreal-memory-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARGO_BUILD_FLAGS: --no-default-features --features server-only,palace,local-embeddings
    container_name: surreal-memory-server
    restart: unless-stopped
    ports:
      # Published on the host loopback only; put a TLS proxy in front of it
      # (see surreal-memory.nginx.conf) for any wider access.
      - "127.0.0.1:23001:3001"
    volumes:
      - ${HOME}/.cache/huggingface/hub:/home/smserver/.cache/huggingface/hub:rw
    environment:
      - SURREAL_MODE=server
      - SURREAL_ENDPOINT=ws://surrealdb:8000
      - SURREAL_USERNAME=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=memory
      - SURREAL_DATABASE=main_local_384
      - EMBEDDING_PROVIDER=local
      - LOCAL_EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - MODEL_CACHE_DIR=/home/smserver/.cache/huggingface
      - MCP_STDIO=false
      # Verified-caller scope (issue #51). The container binds a non-loopback
      # address, so the server refuses to start unless these are all set.
      - API_HOST=0.0.0.0
      - AUTH_MODE=jwt
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:?set AUTH_JWT_ISSUER to the Gate issuer}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:?set AUTH_JWT_AUDIENCE}
      - AUTH_JWT_ALGORITHM=${AUTH_JWT_ALGORITHM:?set AUTH_JWT_ALGORITHM (HS256, RS256, ES256 or EdDSA)}
      - AUTH_JWT_KEY=${AUTH_JWT_KEY:?set AUTH_JWT_KEY (shared secret or public key PEM)}
      # Retry/Reconnection Configuration (defaults shown)
      - SURREAL_MAX_CONNECT_RETRIES=10       # Initial connection attempts
      - SURREAL_MAX_OPERATION_RETRIES=3      # Per-operation retry attempts
      - SURREAL_BASE_RETRY_DELAY_MS=100      # Starting backoff delay
      - SURREAL_MAX_RETRY_DELAY_MS=5000      # Maximum backoff delay
      - SURREAL_RETRY_JITTER_FACTOR=0.25     # Jitter as decimal (0.25 = ±25%)
      - RUST_LOG=debug                       # Enable debug logging
    depends_on:
      surrealdb:
        condition: service_healthy

volumes:
  surrealdb_data:
    driver: local
