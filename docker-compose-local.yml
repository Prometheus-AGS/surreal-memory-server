# Local development compose — recommended day-to-day path.
# Requires a Linux binary at ./target/release/surreal-memory-server that matches
# the image architecture you are about to build. A normal macOS `cargo build`
# output will not work in this container.
# On Apple Silicon, prefer a native Linux arm64 binary for local Docker Desktop.
# Use `LOCAL_DOCKER_PLATFORM=linux/amd64` only when you explicitly want emulated
# amd64 parity. Build that binary with your preferred cross-compilation flow
# (for example `./scripts/build-local-linux-binary.sh`) and place or copy the
# resulting binary at ./target/release/surreal-memory-server.
# Then run:
#   docker compose -f docker-compose-local.yml up -d --build

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.0.0
    container_name: surrealdb
    restart: unless-stopped
    user: root
    command:
      - start
      - --log=info
      - --user=root
      - --pass=root
      - --bind=0.0.0.0:8000
      - rocksdb:/data/database.db
    ports:
      - "28000:8000"
    volumes:
      - surrealdb_data:/data

  surreal-memory-server:
    build:
      context: .
      dockerfile: Dockerfile-local
    env_file:
      - .env
    container_name: surreal-memory-server
    restart: unless-stopped
    ports:
      - "23001:3001"
    environment:
      - SURREAL_MODE=server
      - SURREAL_ENDPOINT=ws://surrealdb:8000
      - SURREAL_USERNAME=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=memory
      - SURREAL_DATABASE=main
      - EMBEDDING_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_STDIO=false
    depends_on:
      - surrealdb

volumes:
  surrealdb_data:
    driver: local
